name: Cloudflare staging build

on:
  push:
    branches:
      - migration/cloudflare-staging
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: production
      SKIP_ENV_VALIDATION: "1"
      DATABASE_URL: postgresql://ci_user:ci_password@127.0.0.1:5432/namedesignai
      NEXTAUTH_SECRET: ci-nextauth-secret
      NEXTAUTH_URL: https://namedesignai-cloudflare-staging.workers.dev
      GOOGLE_CLIENT_ID: ci-google-client-id
      GOOGLE_CLIENT_SECRET: ci-google-client-secret
      REPLICATE_API_TOKEN: ci-replicate-token
      MOCK_REPLICATE: "true"
      ACCESS_KEY_ID: ci-access-key
      SECRET_ACCESS_KEY: ci-secret-key
      STRIPE_SECRET_KEY: sk_test_ci_only
      HOST_NAME: https://namedesignai-cloudflare-staging.workers.dev
      STRIPE_WEB_HOOK_SECRET: whsec_ci_only
      PRICE_ID_STARTER: price_ci_starter
      PRICE_ID_PRO: price_ci_pro
      PRICE_ID_ELITE: price_ci_elite
      MAUTIC_BASE_URL: https://mautic.invalid
      MAUTIC_API_TOKEN: ci-mautic-token
      MAUTIC_USERNAME: ci-mautic-user
      MAUTIC_PASSWORD: ci-mautic-password
      CRON_SECRET: ci-cron-secret
      CPX_SECURITY_HASH: ci-cpx-security-hash
      CPX_APP_ID: ci-cpx-app-id
      IPAPI_KEY: ci-ipapi-key
      PRINTFUL_API_KEY: ci-printful-api-key
      PRINTFUL_WEBHOOK_SECRET: ci-printful-webhook-secret
      META_PIXEL_ID: ci-meta-pixel-id
      META_ACCESS_TOKEN: ci-meta-access-token
      NEXT_PUBLIC_STRIPE_KEY: pk_test_ci_only
      NEXT_PUBLIC_S3_REGION: us-east-1
      NEXT_PUBLIC_S3_BUCKET_NAME: ci-namedesignai-bucket
      NEXT_PUBLIC_META_PIXEL_ID: ci-meta-pixel-id
      NEXT_PUBLIC_ADSENSE_CLIENT_ID: ca-pub-ci-only
      NEXT_PUBLIC_ADSENSE_CONTENT_SLOT_ID: ci-slot

    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: migration/cloudflare-staging
          fetch-depth: 0

      - name: Pin reviewed application commit
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach bd0541e1e782fe182f8afc193008251262f11f4f4
          test "$(git rev-parse HEAD)" = "bd0541e1e782fe182f8afc193008251262f11f4f4"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Build Next.js application
        run: npm run build

      - name: Build OpenNext Cloudflare worker
        run: npx opennextjs-cloudflare build --dangerouslyUseUnsupportedNextVersion

      - name: Verify OpenNext bundle and source safety
        shell: bash
        run: |
          set -euo pipefail

          test -s .open-next/worker.js
          echo "OpenNext bundle verified: .open-next/worker.js is non-empty"

          grep -Fq 'generateIcon: publicProcedure' src/server/api/routers/generate.ts
          grep -Fq 'const imageUrls = await executeIdempotentGenerationRequest' src/server/api/routers/generate.ts
          if rg -n 'invokeGenerationLambda' src/server/api src/pages; then
            echo 'Unexpected active user-facing Lambda dispatch reference found'
            exit 1
          fi
          echo 'Source safety verified: generateIcon remains synchronous and has no active user-facing Lambda dispatch'

      - name: Wrangler dry-run and staging binding checks
        shell: bash
        run: |
          set -euo pipefail

          npx wrangler deploy --config wrangler.jsonc --dry-run > wrangler-dry-run.log 2>&1

          grep -Fq '"name": "namedesignai-cloudflare-staging"' wrangler.jsonc
          grep -Fq '"binding": "DB_SERVICE"' wrangler.jsonc
          grep -Fq '"service": "namedesignai-db-staging"' wrangler.jsonc
          grep -Fq '"GENERATION_LAMBDA_REGION": "us-east-1"' wrangler.jsonc
          grep -Fq '"GENERATION_LAMBDA_FUNCTION_NAME": "namedesignai-generation-staging"' wrangler.jsonc
          if rg -n 'namedesignai-db-auth-test|82d5c021a9cf4b6db58abb4ba7f25842' wrangler.jsonc; then
            echo 'Isolated DB Worker or Hyperdrive reference found in the staging root config'
            exit 1
          fi

          echo 'Wrangler dry-run succeeded'
          echo 'Verified staging bindings: DB_SERVICE=namedesignai-db-staging, Lambda region=us-east-1, Lambda function=namedesignai-generation-staging'

      - name: Report safe build sizes
        shell: bash
        run: |
          set -euo pipefail
          if [[ -s .open-next/worker.js ]]; then
            stat -c 'worker.js bytes: %s' .open-next/worker.js
          else
            echo 'worker.js was not generated or is empty'
            exit 1
          fi
          du -sh .open-next 2>/dev/null || true
